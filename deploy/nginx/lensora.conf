# Lensora vhost: static SPA + reverse-proxied API on one origin (no CORS needed).
#
# HTTP-only phase (no domain yet): keep server_name as the bare IP.
# Once DNS points a real hostname at this server, replace server_name and run
# `certbot --nginx -d <DOMAIN>` — no other change and no frontend rebuild is required,
# since the SPA calls the API via a root-relative path (/api/v1).

limit_req_zone $binary_remote_addr zone=lensora_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lensora_storefront:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 213.199.54.61;

    root /var/www/lensora/frontend;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/v1/auth/login {
        limit_req zone=lensora_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/storefront/ {
        limit_req zone=lensora_storefront burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8300/health;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
