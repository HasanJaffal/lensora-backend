# Production deploy: single-host, host PostgreSQL (not the bundled `db` service from
# docker-compose.yml), host networking so the API only ever binds 127.0.0.1 and is reached
# through the server's nginx reverse proxy. See deploy/nginx/lensora.conf for the vhost.
services:
  api:
    build: .
    image: lensora-api:latest
    env_file: ./.env.production
    network_mode: host
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 400m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
